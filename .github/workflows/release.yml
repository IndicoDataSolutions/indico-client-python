name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: IndicoDataSolutions/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          require-checksums: true
      - run: uv build
      - name: Check built version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          uv run --no-project --with packaging==26.3 python - <<'PY'
          import os
          import pathlib
          import sys

          from packaging.version import Version

          wheels = list(pathlib.Path("dist").glob("*.whl"))
          if len(wheels) != 1:
              sys.exit(f"expected one wheel, found {wheels}")
          built = Version(wheels[0].name.split("-")[1])
          tag = Version(os.environ["TAG"])
          if built != tag:
              sys.exit(f"built version {built} does not match tag {tag}")
          print(f"version {built} matches tag")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/indico-client/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
